name: Ty Type Check

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  type-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      
      - name: Run ty type check
        timeout-minutes: 1
        run: uv run ty check .
